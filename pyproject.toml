[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-downloader"
version = "2.0.0"
description = "YouTube downloader with a Qt GUI: quality picker, MP3 extraction, playlists, queue and history."
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[project.scripts]
yt-downloader = "yt_downloader.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
